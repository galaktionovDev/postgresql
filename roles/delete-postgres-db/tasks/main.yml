---

- name: Drop all connection to DB
  become: true
  raw: docker exec -it cloudbox-postgres psql -U {{ postgres_user }} -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '{{ databasename }}';"

- name: Drop Postgres DB in Docker Container
  become: true
  raw: docker exec -it cloudbox-postgres psql -U {{ postgres_user }} -c "DROP DATABASE {{ databasename }};"

- set_stats:
    data:
      db_info:
        databasename: "{{ databasename }}"
        postgres_user: "{{ postgres_user }}"
        