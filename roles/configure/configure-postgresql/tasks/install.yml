---
- name: Collect ansible_distribution facts
  setup:
    filter:
      - ansible_distribution
      - ansible_distribution_major_version
      - ansible_distribution_version

- name: Install PostgreSQL package for Debian-based distributions
  become: true
  apt:
    name: "postgresql-{{ postgresql_version }}"
    state: present
  when: ansible_distribution.split(' ') | first | lower in ['ubuntu', 'astra', 'debian']

- name: Install PostgreSQL package for RHEL-based distributions
  become: true
  yum:
    name: "postgresql{{ postgresql_version }}-server"
    state: present
    enablerepo: "{{ 'cld-repository-el9' if (ansible_distribution.split(' ') | first | lower == 'red' and ansible_distribution_major_version == '8') else 'cld-repository-el' + ansible_distribution_major_version }}"
    disablerepo: "*"
  when: ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos']

- name: Install Ansible packages for Debian-based distributions
  become: true
  apt:
    name:
      - acl
      - python3-psycopg2
    state: present
  when: ansible_distribution.split(' ') | first | lower in ['ubuntu', 'astra', 'debian']

- name: Install Ansible packages for RHEL-based distributions
  become: true
  yum:
    name:
      - acl
      - python3-psycopg2
    state: present
    enablerepo: "{{ 'cld-repository-el9' if (ansible_distribution.split(' ') | first | lower == 'red' and ansible_distribution_major_version == '8') else 'cld-repository-el' + ansible_distribution_major_version }}"
    disablerepo: "*"
  when: ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos']

- name: Check if PGDG PostgreSQL binary exists (RHEL-based)
  stat:
    path: "/usr/pgsql-{{ postgresql_version }}/bin/postgres"
  register: pgdg_bin_stat
  when: ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos']

- name: Set dynamic PostgreSQL binary path for RHEL-based distributions
  set_fact:
    postgresql_bin_path: "{{ '/usr/pgsql-' ~ postgresql_version ~ '/bin' if pgdg_bin_stat.stat.exists else '/usr/bin' }}"
  when: ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos']

- name: Set dynamic PostgreSQL binary path for Debian-based distributions
  set_fact:
    postgresql_bin_path: "/usr/lib/postgresql/{{ postgresql_version }}/bin"
  when: ansible_distribution.split(' ') | first | lower in ['ubuntu', 'astra', 'debian']