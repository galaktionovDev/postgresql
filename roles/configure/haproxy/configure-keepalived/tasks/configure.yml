---

- name: Create Keepalived scripts user
  become: true
  user:
    name: keepalived_script
    system: true
    shell: /bin/false

- name: Ensure Keepalived configuration directory is created
  become: true
  file:
    path: /etc/keepalived
    state: directory

- name: Create script to check if HAProxy is running or not
  become: true
  template:
    src: check_haproxy.sh.j2
    dest: /etc/keepalived/check_haproxy.sh
    mode: '0750'
    owner: keepalived_script
    group: keepalived_script

- name: Create Keepalived configuration file
  become: true
  template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf

- name: Gather information about packages installed
  package_facts:
    manager: auto

- name: Allow VRRP protocol on RHEL-like distributions
  become: true
  ansible.posix.firewalld:
    rich_rule: rule protocol value="112" accept
    state: enabled
    permanent: true
    immediate: true
  when:
    - "'firewalld' in ansible_facts.packages"
    - ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos']

- name: Allow VRRP multicast on Debian-like distributions
  become: true
  community.general.ufw:
    rule: allow
    direction: in
    to_ip: "224.0.0.18"
  when:
    - "'ufw' in ansible_facts.packages"
    - ansible_distribution.split(' ') | first | lower in ['ubuntu', 'astra', 'debian']