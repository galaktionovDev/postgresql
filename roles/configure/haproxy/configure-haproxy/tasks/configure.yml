---

- name: Ensure HAProxy errors directory is created
  become: true
  file:
    path: /etc/haproxy/errors
    state: directory

- name: Create HAProxy configuration file
  become: true
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg

- name: Gather information about packages installed
  package_facts:
    manager: auto

- name: Allow HAProxy and PostgreSQL ports on RHEL-like distributions
  become: true
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  loop:
    - "{{ server_port }}"
    - "{{ haproxy_port }}"
    - "{{ patroni_port }}"
  when: "'firewalld' in ansible_facts.packages"

- name: Allow HAProxy and PostgreSQL ports on Debian-like distributions
  become: true
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
  loop:
    - "{{ server_port }}"
    - "{{ haproxy_port }}"
    - "{{ patroni_port }}"
  when: "'ufw' in ansible_facts.packages"

- name: Configure SELinux to allow HAProxy and Patroni connections
  become: true
  when: 
    - ansible_selinux is defined
    - ansible_selinux.status != 'disabled'
  block:
    - name: Allow HAProxy and Patroni ports in SELinux (Standard)
      community.general.seport:
        ports: "{{ item }}"
        proto: tcp
        setype: postgresql_port_t
        state: present
      loop:
        - "{{ server_port }}"
        - "{{ patroni_port }}"
        - "{{ haproxy_port }}"
      when: not (ansible_distribution.split(' ') | first | lower == 'red' and ansible_distribution_major_version == '8')

    - name: Allow HAProxy to connect to backend servers (Standard)
      ansible.builtin.seboolean:
        name: haproxy_connect_any
        state: yes
        persistent: yes
      when: not (ansible_distribution.split(' ') | first | lower == 'red' and ansible_distribution_major_version == '8')

    - name: Allow HAProxy and Patroni ports in SELinux via CLI (RED OS 8 Fallback)
      ansible.builtin.shell: |
        if command -v semanage >/dev/null 2>&1; then
          if ! semanage port -l | grep -E -q "\b{{ item }}\b"; then
            semanage port -a -t postgresql_port_t -p tcp {{ item }} || semanage port -m -t postgresql_port_t -p tcp {{ item }}
            echo "changed"
          fi
        else
          echo "WARNING: semanage is missing. Skipping." >&2
        fi
      loop:
        - "{{ server_port }}"
        - "{{ patroni_port }}"
        - "{{ haproxy_port }}"
      register: seport_redos
      changed_when: "'changed' in seport_redos.stdout"
      when:
        - ansible_distribution.split(' ') | first | lower == 'red'
        - ansible_distribution_major_version == '8'

    - name: Allow HAProxy to connect to backend servers via CLI (RED OS 8 Fallback)
      ansible.builtin.shell: |
        if command -v setsebool >/dev/null 2>&1; then
          if ! getsebool haproxy_connect_any | grep -q "on"; then
            setsebool -P haproxy_connect_any 1
            echo "changed"
          fi
        fi
      register: sebool_redos
      changed_when: "'changed' in sebool_redos.stdout"
      when:
        - ansible_distribution.split(' ') | first | lower == 'red'
        - ansible_distribution_major_version == '8'