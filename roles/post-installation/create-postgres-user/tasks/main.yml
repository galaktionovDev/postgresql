---

- name: Ensure user is created
  community.postgresql.postgresql_user:
    name: "{{ postgresql_username }}"
    password: "{{ postgresql_user_password }}"
    role_attr_flags: "LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE"
    login_host: "{{ postgresql_server_address }}"
    login_port: "{{ postgresql_server_port }}"
    login_user: postgres
    login_password: "{{ postgresql_admin_password }}"
    login_db: postgres

- name: Allow connection for user {{ postgresql_username }} to any database (Single instance)
  become: true
  community.general.postgresql_pg_hba:
    dest: "{{ postgresql_data_directory }}/pg_hba.conf"
    contype: host
    databases: all
    users: "{{ postgresql_username }}"
    address: all
    method: md5
    state: present
  when: deployment_option == 'single-instance'
  notify:
    - Reload Postgresql service

- name: Allow connection for user {{ postgresql_username }} to any database (High availability)
  block:
    - name: Get current Patroni configuration
      ansible.builtin.uri:
        url: "http://{{ postgresql_server_address }}:{{ patroni_port }}/config"
        method: GET
      register: current_patroni_config

    - name: Update pg_hba with new user
      ansible.builtin.uri:
        url: "http://{{ postgresql_server_address }}:{{ patroni_port }}/config"
        method: PATCH
        body_format: json
        body:
          postgresql:
            pg_hba: "{{ updated_pg_hba }}"
        status_code: 200
      vars:
        new_rule: "hostssl all {{ postgresql_username }} 0.0.0.0/0 md5"
        updated_pg_hba: "{{ current_patroni_config.json.postgresql.pg_hba | union([new_rule]) }}"
      changed_when: current_patroni_config.json.postgresql.pg_hba | length < updated_pg_hba | length

  when: deployment_option == 'high-availability'

- set_stats:
    data:
      db_users:
        username: "{{ postgresql_username }}"
