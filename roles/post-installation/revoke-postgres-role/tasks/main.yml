---

- name: Revoke PostgreSQL access from a user
  become: true
  block:

    - name: Discover the owner of {{ postgresql_database }}
      community.postgresql.postgresql_query:
        db: "{{ postgresql_database }}"
        query: >-
          SELECT pg_catalog.pg_get_userbyid(datdba) AS owner
          FROM pg_catalog.pg_database
          WHERE datname = current_database()
        login_host: "{{ postgresql_server_address }}"
        login_port: "{{ postgresql_server_port }}"
        login_user: postgres
        login_password: "{{ postgresql_admin_password }}"
      register: db_owner_query

    - name: Set the database owner fact
      set_fact:
        postgresql_db_owner: "{{ db_owner_query.query_result[0].owner }}"

    - name: Remove default privileges for future objects
      community.postgresql.postgresql_query:
        db: "{{ postgresql_database }}"
        query:
          - >-
            ALTER DEFAULT PRIVILEGES FOR ROLE "{{ postgresql_db_owner }}"
            IN SCHEMA public REVOKE ALL ON TABLES FROM "{{ postgresql_username }}"
          - >-
            ALTER DEFAULT PRIVILEGES FOR ROLE "{{ postgresql_db_owner }}"
            IN SCHEMA public REVOKE ALL ON SEQUENCES FROM "{{ postgresql_username }}"
        login_host: "{{ postgresql_server_address }}"
        login_port: "{{ postgresql_server_port }}"
        login_user: postgres
        login_password: "{{ postgresql_admin_password }}"

    - name: Revoke all privileges on existing tables
      community.postgresql.postgresql_privs:
        db: "{{ postgresql_database }}"
        type: table
        schema: public
        objs: ALL_IN_SCHEMA
        privs: ALL
        role: "{{ postgresql_username }}"
        login_host: "{{ postgresql_server_address }}"
        login_port: "{{ postgresql_server_port }}"
        login_user: postgres
        login_password: "{{ postgresql_admin_password }}"
        state: absent

    - name: Revoke all privileges on existing sequences
      community.postgresql.postgresql_privs:
        db: "{{ postgresql_database }}"
        type: sequence
        schema: public
        objs: ALL_IN_SCHEMA
        privs: ALL
        role: "{{ postgresql_username }}"
        login_host: "{{ postgresql_server_address }}"
        login_port: "{{ postgresql_server_port }}"
        login_user: postgres
        login_password: "{{ postgresql_admin_password }}"
        state: absent

    - name: Revoke USAGE on schema public
      community.postgresql.postgresql_privs:
        db: "{{ postgresql_database }}"
        type: schema
        objs: public
        privs: ALL
        role: "{{ postgresql_username }}"
        login_host: "{{ postgresql_server_address }}"
        login_port: "{{ postgresql_server_port }}"
        login_user: postgres
        login_password: "{{ postgresql_admin_password }}"
        state: absent

    - name: Revoke CONNECT on the database
      community.postgresql.postgresql_privs:
        db: "{{ postgresql_database }}"
        type: database
        objs: "{{ postgresql_database }}"
        privs: ALL
        role: "{{ postgresql_username }}"
        login_host: "{{ postgresql_server_address }}"
        login_port: "{{ postgresql_server_port }}"
        login_user: postgres
        login_password: "{{ postgresql_admin_password }}"
        state: absent

- set_stats:
    data:
      db_roles:
        username: "{{ postgresql_username }}"
        role_name: "{{ postgresql_role }}"
        database_name: "{{ postgresql_database }}"